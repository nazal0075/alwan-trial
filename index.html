<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alwan Restaurant | Authentic Kerala & South Indian Cuisine in Ajman</title>
    <meta name="description" content="Authentic Kerala and South Indian restaurant in Ajman Industrial 2. Best Chicken Biryani, Grilled Chicken, and Kebabs. Open 6 AM – 1 AM.">
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="header-content">
            <h1>ALWAN<span>AJMAN</span></h1>
        </div>
    </header>

    <main>
        <section class="hero" id="hero">
            <div class="scene" id="scene">
                <div class="layer-bg brand-font">ALWAN</div>
                
                <div class="layer-plate" id="plate">
                    <!-- Biryani Plate Image -->
                    <img src="assets/biryani.png" alt="Authentic Chicken Biryani" id="target-plate">
                </div>

                <div class="spice-emoji spice-1"><img src="assets/chili.png" alt="Chili"></div>
                <div class="spice-emoji spice-2"><img src="assets/mint.png" alt="Mint"></div>
                <div class="spice-emoji spice-3"><img src="https://images.unsplash.com/photo-1590502593717-10356b835b7b" alt="Lemon"></div>
            </div>
        </section>

        <section class="menu-section">
            <h2 class="section-title">Local Favorites</h2>
            <div class="menu-grid">
                <div class="menu-item">
                    <img src="assets/biryani.png" alt="Chicken Biryani" class="menu-thumb">
                    <h3>Chicken Biryani</h3>
                    <p class="price">AED 15</p>
                </div>
                <div class="menu-item">
                    <img src="https://images.unsplash.com/photo-1598515214211-89d3c73ae83b?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=80" alt="Chicken Grill" class="menu-thumb">
                    <h3>Chicken Grill</h3>
                    <p class="price">AED 28</p>
                </div>
                <div class="menu-item">
                    <img src="https://images.unsplash.com/photo-1599487488170-d11ec9c172f0?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=80" alt="Kebab Stick" class="menu-thumb">
                    <h3>Kebab Stick</h3>
                    <p class="price">AED 5</p>
                </div>
                <div class="menu-item">
                    <img src="https://images.unsplash.com/photo-1603894584373-5ac82b2ae398?ixlib=rb-4.0.3&auto=format&fit=crop&w=300&q=80" alt="Chicken Mughal" class="menu-thumb">
                    <h3>Chicken Mughal</h3>
                    <p class="price">AED 18</p>
                </div>
            </div>
        </section>

        <section class="location-section">
            <h2 class="section-title">Find Us</h2>
            <div class="map-container">
                <iframe 
                    width="100%" 
                    height="100%" 
                    frameborder="0" 
                    style="border:0" 
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3604.2882253381!2d55.4851286!3d25.405177!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3e5f5835694a1d47%3A0xc6e4f3a7433842c1!2sAlwan%20Restaurant!5e0!3m2!1sen!2sae!4v1690000000000!5m2!1sen!2sae" 
                    allowfullscreen>
                </iframe>
            </div>
            <div class="location-info">
                <p><strong>Location:</strong> Ajman Industrial 2, Lucky Roundabout</p>
                <p><strong>Cuisine:</strong> Authentic Kerala & South Indian</p>
                <p><strong>Hours:</strong> 6:00 AM – 1:00 AM</p>
            </div>
        </section>
    </main>

    <div class="action-bar">
        <a href="tel:067434660" class="btn btn-call">
            <i class="fa-solid fa-phone"></i>
            Call Now
        </a>
        <a href="https://wa.me/97167434660" class="btn btn-whatsapp" target="_blank">
            <i class="fa-brands fa-whatsapp"></i>
            WhatsApp
        </a>
    </div>

    <script src="app.js"></script>
</body>
</html>
